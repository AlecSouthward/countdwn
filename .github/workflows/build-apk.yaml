name: Build APK

on:
  release:
    types: [published]

jobs:
  build-web:
    name: Build Web Assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Upload android directory
        uses: actions/upload-artifact@v4
        with:
          name: android-synced
          path: android/
          retention-days: 1

  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: build-web

    steps:
      - name: Download android directory
        uses: actions/download-artifact@v4
        with:
          name: android-synced
          path: android/

      - name: Set up Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set SDK path in local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: android

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-unsigned
          path: android/app/build/outputs/apk/release/
          retention-days: 1

  sign-and-release:
    name: Sign & Upload APK
    runs-on: ubuntu-latest
    needs: build-apk

    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: apk-unsigned
          path: android/app/build/outputs/apk/release/

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sign APK
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > keystore.jks
          $ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEY_STORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out android/app/build/outputs/apk/release/countdwn-${{ github.ref_name }}.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/countdwn-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/countdwn-${{ github.ref_name }}.apk
          retention-days: 30
