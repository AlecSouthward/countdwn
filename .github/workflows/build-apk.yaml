name: Build APK

on:
  release:
    types: [published]

jobs:
  setup:
    name: Install Dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  build-web:
    name: Build Web Assets
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Upload android directory
        uses: actions/upload-artifact@v4
        with:
          name: android-synced
          path: android/
          retention-days: 1

  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: build-web

    steps:
      - name: Download android directory
        uses: actions/download-artifact@v4
        with:
          name: android-synced
          path: android/

      - name: Set up Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: android

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-unsigned
          path: android/app/build/outputs/apk/release/
          retention-days: 1

  sign-and-release:
    name: Sign & Upload APK
    runs-on: ubuntu-latest
    needs: build-apk

    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: apk-unsigned
          path: android/app/build/outputs/apk/release/

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '36.0.0'

      - name: Rename signed APK
        run: |
          mv "${{ steps.sign_apk.outputs.signedReleaseFile }}" \
             android/app/build/outputs/apk/release/countdwn-${{ github.ref_name }}.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/countdwn-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/countdwn-${{ github.ref_name }}.apk
          retention-days: 30
