name: Build & Release Signed APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build, Sign & Upload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & sign APK (Capacitor)
        uses: bytevictor/action-capacitor-android@v2
        with:
          build-command: npm run build
          web-dir: dist
          keystore-content: ${{ secrets.RELEASE_KEYSTORE }}
          keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          github-token: ${{ secrets.ACCESS_TOKEN }}
