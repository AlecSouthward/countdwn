name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint
        run: pipx run ruff==0.17.0 check .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: countdwn:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name countdwn -p 8080:8080 countdwn:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/api/countdowns > /dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:8080/ | grep -q '<title>Countdwn</title>'
          curl -sf -X POST http://localhost:8080/api/countdowns \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI","target":"2030-01-01"}' | grep -q '"title": "CI"'
          curl -sf http://localhost:8080/api/countdowns | grep -q '"title": "CI"'

      - name: Container logs
        if: always()
        run: docker logs countdwn
